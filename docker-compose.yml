services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: campaign:latest
    container_name: campaign-app
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Local dev server (runs vite dev, hot reload enabled)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: campaign-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev
